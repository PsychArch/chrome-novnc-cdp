[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -ac
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=openbox
environment=DISPLAY=":99",HOME="/home/chrome"
user=chrome
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -noshm -localhost -noipv6 -rfbport 5900
environment=HOME="/home/chrome"
user=chrome
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=/opt/noVNC/utils/websockify/run --web /opt/noVNC %(ENV_SERVICE_BIND_HOST)s:6080 localhost:5900
environment=HOME="/home/chrome"
user=chrome
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socat]
command=socat TCP-LISTEN:9222,fork,reuseaddr,bind=%(ENV_SERVICE_BIND_HOST)s TCP:127.0.0.1:9223
environment=HOME="/home/chrome"
user=chrome
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
command=chromium-browser --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --disable-crash-reporter --remote-debugging-port=9223 --remote-debugging-address=127.0.0.1 --user-data-dir="%(ENV_CHROME_USER_DATA_DIR)s" --profile-directory="%(ENV_CHROME_PROFILE_DIR)s" --window-size=%(ENV_SCREEN_WIDTH)s,%(ENV_SCREEN_HEIGHT)s %(ENV_CHROME_EXTRA_ARGS)s %(ENV_START_URL)s
environment=DISPLAY=":99",HOME="/home/chrome"
user=chrome
priority=60
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
