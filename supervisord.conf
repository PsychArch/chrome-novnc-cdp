[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_BROWSER_WIDTH)sx%(ENV_BROWSER_HEIGHT)sx%(ENV_BROWSER_DEPTH)s -ac
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=openbox
environment=DISPLAY=":99",HOME="/home/chrome"
user=chrome
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -noshm -localhost -noipv6 -rfbport 5900
environment=HOME="/home/chrome"
user=chrome
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=/opt/noVNC/utils/websockify/run --web /opt/noVNC %(ENV_BIND_HOST)s:6080 localhost:5900
environment=HOME="/home/chrome"
user=chrome
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:session-manager]
command=node /opt/session-manager/server.mjs
environment=DISPLAY=":99",HOME="/home/chrome"
user=chrome
priority=50
startsecs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
