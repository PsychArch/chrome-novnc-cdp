name: docker

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate docker compose
        run: docker compose -f docker-compose.yml config

      - name: Build image
        run: docker build --pull -t chrome-novnc-cdp:test .

      - name: Smoke test container endpoints
        run: |
          docker run -d --name chrome-novnc-cdp-smoke \
            -p 127.0.0.1:6080:6080 \
            -p 127.0.0.1:9222:9222 \
            chrome-novnc-cdp:test

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null && \
               curl -fsS http://127.0.0.1:6080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Smoke test failed: endpoints did not become ready in time" >&2
          docker logs chrome-novnc-cdp-smoke || true
          exit 1

      - name: Cleanup smoke test container
        if: always()
        run: docker rm -f chrome-novnc-cdp-smoke || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "REPO_NAME=$(basename '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Validate GHCR secrets
        run: |
          test -n "${{ secrets.GHCR_USERNAME }}" || { echo "Missing GHCR_USERNAME secret"; exit 1; }
          test -n "${{ secrets.GHCR_TOKEN }}" || { echo "Missing GHCR_TOKEN secret"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Validate Docker Hub secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || { echo "Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "Missing DOCKERHUB_TOKEN secret"; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
