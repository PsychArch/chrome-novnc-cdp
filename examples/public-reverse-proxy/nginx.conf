# nginx single-host path-prefix example.
# Keep PUBLIC_CDP_BASE_PATH=/cdp on the chrome service.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream chrome_novnc {
  server chrome:6080;
}

upstream chrome_cdp {
  server chrome:9222;
}

server {
  listen 443 ssl http2;
  server_name example.com;

  ssl_certificate /etc/nginx/certs/example.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/example.com/privkey.pem;

  location = /browser {
    return 302 /browser/vnc.html?path=browser/websockify;
  }

  location = /browser/ {
    return 302 /browser/vnc.html?path=browser/websockify;
  }

  location /browser/ {
    auth_basic "chrome-novnc-cdp";
    auth_basic_user_file /etc/nginx/htpasswd;

    rewrite ^/browser/(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://chrome_novnc;
  }

  location = /cdp {
    return 302 /cdp/json/version;
  }

  location /cdp/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://chrome_cdp;
  }
}
