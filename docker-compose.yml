services:
  chrome:
    build:
      context: .
      args:
        NOVNC_VERSION: ${NOVNC_VERSION:-1.6.0}
        NOVNC_SHA256: ${NOVNC_SHA256:-5066103959ef4e9b10f37e5a148627360dd8414e4cf8a7db92bdbd022e728aaa}
        WEBSOCKIFY_VERSION: ${WEBSOCKIFY_VERSION:-0.13.0}
        WEBSOCKIFY_SHA256: ${WEBSOCKIFY_SHA256:-b6413e364efd04f3c92ec8c17747e3c4adc20157c2ef1c5d019a26d944a46df8}
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:9222:${CDP_PORT:-9222}"
    environment:
      TZ: ${TZ:-UTC}
      BROWSER_WIDTH: ${BROWSER_WIDTH:-1920}
      BROWSER_HEIGHT: ${BROWSER_HEIGHT:-1080}
      BROWSER_DEPTH: ${BROWSER_DEPTH:-24}
      BROWSER_START_URL: ${BROWSER_START_URL:-about:blank}
      BROWSER_EXTRA_ARGS: ${BROWSER_EXTRA_ARGS:-}
      BIND_HOST: ${BIND_HOST:-0.0.0.0}
      PUBLIC_CDP_BASE_PATH: ${PUBLIC_CDP_BASE_PATH:-}
      CDP_PORT: ${CDP_PORT:-9222}
      ENABLE_HOST_GATEWAY: ${ENABLE_HOST_GATEWAY:-false}
      MAX_SESSIONS: ${MAX_SESSIONS:-4}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-1h}
      SESSION_SWEEP_INTERVAL: ${SESSION_SWEEP_INTERVAL:-15s}
      CDP_AUTH_TOKEN: ${CDP_AUTH_TOKEN:-}
      CDP_COMPAT_AUTO_SESSION: ${CDP_COMPAT_AUTO_SESSION:-true}
      CDP_ALLOW_UNAUTHENTICATED_LOCAL: ${CDP_ALLOW_UNAUTHENTICATED_LOCAL:-false}
      CDP_ALLOW_QUERY_TOKEN: ${CDP_ALLOW_QUERY_TOKEN:-false}
    shm_size: "2g"
    restart: unless-stopped
